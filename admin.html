<!doctype html>
<html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NODIR MARKET — Admin</title>
<style>
body{margin:0;background:#0b0b0c;color:#eee;font-family:Arial,sans-serif}main{max-width:1050px;margin:auto;padding:30px 18px}.gold{color:#d8bd78}.panel{background:#131313;border:1px solid #303030;border-radius:16px;padding:20px;margin:15px 0}input,textarea,select{width:100%;box-sizing:border-box;padding:11px;margin:6px 0 12px;background:#0b0b0b;border:1px solid #444;border-radius:8px;color:#fff}button{padding:10px 14px;border:0;border-radius:8px;cursor:pointer;font-weight:700}.primary{background:#d8bd78;color:#111}.danger{background:#7b2727;color:#fff}.product,.order{border-top:1px solid #333;padding:15px 0}.product{display:grid;grid-template-columns:80px 1fr auto;gap:15px;align-items:center}.thumb{width:80px;height:80px;object-fit:cover;background:#222;border-radius:10px}.muted{color:#999;font-size:13px}@media(max-width:650px){.product{grid-template-columns:60px 1fr}.product .actions{grid-column:2}.thumb{width:60px;height:60px}}
</style></head><body><main>
<h1>NODIR <span class="gold">MARKET</span> — Admin</h1>
<div id="login" class="panel"><h2>Admin kirish</h2><input id="u" placeholder="Login"><input id="p" type="password" placeholder="Parol"><button class="primary" onclick="login()">Kirish</button><p id="err"></p></div>
<div id="app" style="display:none">
<div class="panel"><button onclick="logout()">Chiqish</button> <a href="/" style="color:#d8bd78;margin-left:12px">Do‘konni ochish</a></div>
<div class="panel"><h2>Mahsulot qo‘shish</h2><input id="name" placeholder="Mahsulot nomi"><select id="cat"><option>Soat</option><option>Uzuk</option><option>Bilaguzuk</option><option>Zanjir</option><option>Boshqa</option></select><input id="price" type="number" placeholder="Narx (so‘m)"><textarea id="desc" placeholder="Qisqa tavsif"></textarea><input id="img" type="file" accept="image/*"><button class="primary" onclick="addProduct()">Qo‘shish</button></div>
<div class="panel"><h2>Mahsulotlar</h2><div id="products"></div></div>
<div class="panel"><h2>Buyurtmalar</h2><div id="orders"></div></div>
</div></main>
<script>
const $=id=>document.getElementById(id); const money=n=>Number(n).toLocaleString("uz-UZ");
async function me(){let d=await fetch("/api/me").then(r=>r.json());$("login").style.display=d.admin?"none":"block";$("app").style.display=d.admin?"block":"none";if(d.admin){loadProducts();loadOrders()}}
async function login(){let r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:$("u").value,password:$("p").value})});if(r.ok)me();else $("err").textContent=(await r.json()).error}
async function logout(){await fetch("/api/logout",{method:"POST"});me()}
async function addProduct(){let f=new FormData();f.append("name",$("name").value);f.append("category",$("cat").value);f.append("price",$("price").value);f.append("description",$("desc").value);if($("img").files[0])f.append("image",$("img").files[0]);let r=await fetch("/api/products",{method:"POST",body:f});if(!r.ok)return alert((await r.json()).error);["name","price","desc"].forEach(x=>$(x).value="");$("img").value="";loadProducts()}
async function loadProducts(){let ps=await fetch("/api/products").then(r=>r.json());$("products").innerHTML=ps.map(p=>`<div class="product"><img class="thumb" src="${p.image||'data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2280%22 height=%2280%22><rect width=%22100%25%22 height=%22100%25%22 fill=%22%23222222%22/><text x=%2250%25%22 y=%2255%25%22 fill=%22%23d8bd78%22 text-anchor=%22middle%22>N/M</text></svg>'}"><div><b>${esc(p.name)}</b><div class="muted">${p.category} · ${money(p.price)} so‘m</div><div class="muted">${esc(p.description||"")}</div></div><div class="actions"><button onclick="editP(${p.id})">Tahrirlash</button> <button class="danger" onclick="delP(${p.id})">O‘chirish</button></div></div>`).join("")}
async function editP(id){let name=prompt("Yangi nom?");if(name===null)return;let price=prompt("Yangi narx?");if(price===null)return;let f=new FormData();f.append("name",name);f.append("category","Soat");f.append("price",price);f.append("description","");let r=await fetch("/api/products/"+id,{method:"PUT",body:f});if(!r.ok)alert((await r.json()).error);loadProducts()}
async function delP(id){if(!confirm("O‘chirasizmi?"))return;await fetch("/api/products/"+id,{method:"DELETE"});loadProducts()}
async function loadOrders(){let os=await fetch("/api/orders").then(r=>r.json());$("orders").innerHTML=os.length?os.map(o=>{let items=JSON.parse(o.items_json);return `<div class="order"><b>#${o.id} — ${esc(o.customer_name)}</b><div class="muted">${esc(o.phone)} · ${esc(o.address||"-")} · ${esc(o.payment)}</div><p>${items.map(i=>`${esc(i.name)} ×${i.qty}`).join(", ")}</p><b>${money(o.total)} so‘m</b><br><select onchange="status(${o.id},this.value)"><option ${o.status==="new"?"selected":""}>new</option><option ${o.status==="confirmed"?"selected":""}>confirmed</option><option ${o.status==="sent"?"selected":""}>sent</option><option ${o.status==="completed"?"selected":""}>completed</option><option ${o.status==="cancelled"?"selected":""}>cancelled</option></select></div>`}).join(""):"Hozircha buyurtma yo‘q."}
async function status(id,s){await fetch("/api/orders/"+id,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({status:s})});loadOrders()}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
me();
</script></body></html>
